name: Controller validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Controller validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate Python and Trusted Specification
        run: |
          set -euo pipefail
          python3 -m py_compile qa/run_trusted_tests.py tests/test_run_trusted_tests.py
          python3 -m unittest -v tests.test_run_trusted_tests
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path("fixtures/synthetic-candidate")
          digest = hashlib.sha256()
          files = []
          for current, dirs, names in os.walk(root, followlinks=False):
              dirs.sort()
              names.sort()
              for name in names:
                  path = Path(current) / name
                  rel = path.relative_to(root).as_posix()
                  files.append(rel)
                  digest.update(rel.encode("utf-8") + b"\0")
                  digest.update(hashlib.sha256(path.read_bytes()).digest())
          spec = json.loads(Path("qa/trusted-spec-template.json").read_text(encoding="utf-8"))
          spec["mode"] = "synthetic"
          spec["controller_sha"] = os.environ["GITHUB_SHA"]
          spec["source_tree_sha256"] = digest.hexdigest()
          Path("/tmp/controller-validation-spec.json").write_text(
              json.dumps(spec, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          python3 qa/run_trusted_tests.py \
            --candidate fixtures/synthetic-candidate \
            --spec /tmp/controller-validation-spec.json \
            --output /tmp/controller-validation-results.json

      - name: Upload Validation Evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controller-validation-${{ github.sha }}
          path: /tmp/controller-validation-*
          if-no-files-found: error
          retention-days: 30
